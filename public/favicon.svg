<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14"/>
      <stop offset="100%" stop-color="#161B26"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="12"/>

  <!-- Outer Glow Hexagon Ring -->
  <polygon points="256,64 416,160 416,352 256,448 96,352 96,160" fill="none" stroke="url(#brandGrad)" stroke-width="16" filter="url(#glow)" opacity="0.85"/>

  <!-- Logo Tech Initials: AN -->
  <text x="256" y="320" font-family="'Syne', 'Inter', system-ui, sans-serif" font-weight="900" font-size="210" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="-6" filter="url(#glow)">AN</text>
</svg>